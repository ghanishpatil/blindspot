[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot-ecdat-backend"
version = "0.1.0"
description = "Blindspot ECDAT — cryptographic discovery, CBOM, Mosca risk analysis, and PQC recommendation"
requires-python = ">=3.11"

[project.scripts]
# CI/CD guardrail CLI. Installed on PATH by ``pip install -e .`` from
# the backend directory. See ``app/cli/main.py``.
blindspot-scan = "app.cli.main:main"

[tool.setuptools.packages.find]
# Ship the app package (and only the app package). Tests, artefacts,
# and virtualenvs are excluded so a wheel stays small.
where = ["."]
include = ["app*"]
exclude = ["tests*", "artifacts*", ".venv*", ".pytest_cache*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]
